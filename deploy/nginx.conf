# /etc/nginx/sites-available/portfolio
# HTTP only: certbot adds the HTTPS part itself. Do not copy this file over the server's one after that.

# www goes to the bare domain, so the site has a single address.
server {
    listen 80;
    listen [::]:80;
    server_name www.oscarwagoussi.tech;
    return 301 $scheme://oscarwagoussi.tech$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name oscarwagoussi.tech;

    root /var/www/portfolio/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed file names: can be cached for a year. `expires` keeps the headers above, add_header here would drop them.
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }
    location /cv/ {
        expires 1h;
        try_files $uri =404;
    }
    # Every other path is a React route.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
